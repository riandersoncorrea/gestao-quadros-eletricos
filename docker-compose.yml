# Executa a SPA em contêiner localmente, do mesmo jeito que rodaria em
# produção (Azure App Service ou outra infraestrutura corporativa). Não
# afeta o deploy atual (GitHub Pages / Netlify).
#
# Uso:
#   cp .env.local.example .env.docker   # preencher com valores reais
#   docker compose --env-file .env.docker up --build
#   -> http://localhost:8080

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
