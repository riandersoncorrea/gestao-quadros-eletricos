# Configuração de produção para servir a SPA (build estático do Vite) em
# contêiner. Usada pelo Dockerfile na etapa de runtime.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Endpoint leve de health check — não depende do bundle JS carregar,
    # útil para health probe do Azure App Service / orquestrador.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome (ex.: index-Cn1QX3i_.js) podem ser cacheados
    # de forma agressiva e imutável — um novo build gera um nome novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Roteamento client-side (React Router): qualquer caminho que não seja
    # um arquivo real cai no index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
